# Public media gateway in front of Openinary (see the "media" service in compose.yaml).
# Serves only GET/HEAD /t/<allowed preset>/games/<gameId>/<file> (presets in presets.conf).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker's DNS: resolve "openinary" per request, so a recreated container (new IP) doesn't break the gateway
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The client address comes from the reverse proxy / tunnel in front (X-Forwarded-For), trusted only from private
    # networks. It is what Openinary's own per-IP limiter and the limit below see
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # A page shows dozens of images at once; this only stops scripted floods
    limit_req_zone $binary_remote_addr zone=media:10m rate=50r/s;
    limit_req_status 429;

    include /etc/nginx/presets.conf;
    # Errors from Openinary (404 etc.) are plain text, not images
    map "$status:$media_type" $media_content_type {
        "~^200:(?<media_ok_type>.+)$" $media_ok_type;
        default "text/plain; charset=utf-8";
    }

    server {
        listen 8080;
        client_max_body_size 1k;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # /t/<transformation>/games/<gameId>/<file>[/<file>...]
        location ~ "^/t/(?<media_transform>[^/]+)/(?<media_path>games/[0-9]+(?:/[A-Za-z0-9_-][A-Za-z0-9._-]*)+)$" {
            limit_except GET {
                deny all;
            }
            if ($media_type = "") {
                return 403;
            }
            limit_req zone=media burst=500 nodelay;

            set $openinary openinary:3000;
            # $uri drops the query string: every distinct URL is a cache entry upstream
            proxy_pass http://$openinary$uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_hide_header X-RateLimit-Limit;
            proxy_hide_header X-RateLimit-Remaining;
            proxy_hide_header X-RateLimit-Reset;
            # See presets.conf: the upstream type is wrong on cache hits
            proxy_hide_header Content-Type;
            add_header Content-Type $media_content_type always;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
