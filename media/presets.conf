# Transformations the public media gateway lets through to Openinary: "<transformation>" "<Content-Type>";
# Keep in sync with MEDIA_PRESETS in web-frontend/src/utils/media.ts and the backend's prewarm list. Anything else
# gets 403, including the bare /t/<path> (it is not the untouched original: Openinary converts it by the Accept header
# and sends no Vary: Accept, so a shared cache could serve AVIF to a browser without AVIF support).
# Every preset names its format explicitly, which also lets the gateway send the right Content-Type: Openinary v0.5.0
# labels cache hits by the original's extension (WebP bytes as image/jpeg), only the first render is labelled right.
map $media_transform $media_type {
    default "";
    "w_460,f_webp"              "image/webp";  # header: cards, search, game page cover (Steam header.jpg is 460×215)
    "w_600,h_338,c_fill,f_webp" "image/webp";  # thumb: screenshot thumbnails (Steam's .600x338.jpg)
    "f_webp,q_90"               "image/webp";  # full: screenshot in the lightbox
}
