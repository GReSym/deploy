# GReSym local stack. Run through ./manage.sh (it creates the data dirs and .env first).
#   docker compose up -d                 → infrastructure only: MariaDB, RabbitMQ, Milvus
#   docker compose --profile app up -d   → + API, ML API, ML worker
# With TORCH_BACKEND=rocm|cuda in .env, manage.sh also loads compose.rocm.yaml / compose.cuda.yaml (GPU for ml-worker):
# use ./manage.sh, or pass -f compose.yaml -f compose.<backend>.yaml to docker compose yourself.
# Every port is published on 127.0.0.1 only. Data lives in ./data (bind mounts, git-ignored).
# Secrets come from .env (generated by `./manage.sh setup` from backend/config.json and ml/config.json).

name: gresym

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?run ./manage.sh setup}
      MARIADB_DATABASE: ${DB_NAME:?run ./manage.sh setup}
      # App user (backend/config.json), created as '%' with ALL on the database: EF migrations need DDL rights
      MARIADB_USER: ${DB_USER:?run ./manage.sh setup}
      MARIADB_PASSWORD: ${DB_PASSWORD:?run ./manage.sh setup}
      # Read-only user (ml/config.json, ~/.my.cnf), created by initdb/00-readonly-user.sh
      GRESYM_READONLY_USER: ${DB_READONLY_USER:-}
      GRESYM_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-}
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./mariadb/conf/gresym.cnf:/etc/mysql/conf.d/gresym.cnf:ro
      # initdb scripts and the seed dump run only when ./data/mariadb is empty
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
      - ./mariadb/seed:/seed:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      # importing a seed dump takes minutes; failures during start_period don't count
      start_period: 30m
      start_interval: 5s

  rabbitmq:
    image: rabbitmq:4.2-management
    restart: unless-stopped
    # The data dir is keyed by the node name rabbit@<hostname>: a fixed hostname keeps the state across container re-creation
    hostname: rabbitmq
    environment:
      # Applied only on the first start (empty data dir). The default user gets full rights on vhost "/"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?run ./manage.sh setup}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run ./manage.sh setup}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 5s

  # Same as prepare_milvus_volume() of the official standalone_embed.sh: Milvus runs as the "milvus" user,
  # so the data dir is chowned once (a marker file records it)
  milvus-init:
    image: milvusdb/milvus:v3.0.2
    user: "0:0"
    network_mode: none
    read_only: true
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
            echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
            chown -R "$${uid}:$${gid}" /var/lib/milvus
            touch "$${marker}"
            chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ./data/milvus:/var/lib/milvus

  # Milvus metadata store. Not embedded in Milvus (as in the official standalone_embed.sh) since 2026-10-24: embedded etcd
  # serves before it has elected itself leader, Milvus' first read fails with "etcdserver: leader changed" and Milvus
  # panics, often enough to crash-loop. Same etcd version and data dir (data/milvus/etcd) as the embedded one had.
  etcd:
    image: quay.io/coreos/etcd:v3.5.33
    restart: unless-stopped
    user: "999:999"  # the milvus user of the Milvus image, owner of data/milvus (see milvus-init)
    command: ["etcd"]
    environment:
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/milvus:/var/lib/milvus
    healthcheck:
      # healthy = has a leader, so Milvus never sees the election
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      milvus-init:
        condition: service_completed_successfully

  # Translation of run_embed() of the official standalone_embed.sh (Milvus v3.0.2, local storage), but with external etcd
  milvus:
    image: milvusdb/milvus:v3.0.2
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ./data/milvus:/var/lib/milvus
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
      start_interval: 5s
    depends_on:
      milvus-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy

  api:
    profiles: [app]
    build: ../backend
    image: gresym/api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: ${API_DB_CONNECTION:?run ./manage.sh setup}
      Jwt__Key: ${JWT_KEY:?run ./manage.sh setup}
      Jwt__ExpireMinutes: ${JWT_EXPIRE_MINUTES:-60}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Ml__BaseUrl: http://ml-api:8000
    ports:
      - "127.0.0.1:5147:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ml-api:
    profiles: [app]
    build:
      context: ../ml
      args:
        # cpu | rocm | cuda (deploy/.env). GPU access for ml-worker comes from compose.<backend>.yaml (added by manage.sh)
        TORCH_BACKEND: ${TORCH_BACKEND:-cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
    image: gresym/ml
    restart: unless-stopped
    command: ["ml", "api"]
    environment: &ml-env
      GRESYM_ML__DATABASE__HOST: mariadb
      GRESYM_ML__DATABASE__PORT: "3306"
      GRESYM_ML__DATABASE__DATABASE: ${DB_NAME}
      GRESYM_ML__DATABASE__USER: ${DB_READONLY_USER:?run ./manage.sh setup}
      GRESYM_ML__DATABASE__PASSWORD: ${DB_READONLY_PASSWORD:?run ./manage.sh setup}
      GRESYM_ML__MILVUS__URI: http://milvus:19530
      GRESYM_ML__RABBITMQ__HOST: rabbitmq
      GRESYM_ML__RABBITMQ__USER: ${RABBITMQ_USER}
      GRESYM_ML__RABBITMQ__PASSWORD: ${RABBITMQ_PASSWORD}
      GRESYM_ML__MODEL__PATH: /models/Qwen3-Embedding
      GRESYM_ML__MODEL__ONNX_PATH: /models/Qwen3-Embedding-onnx
      # inside the container; the host port below stays on 127.0.0.1 (the ML API has no auth)
      GRESYM_ML__API__HOST: 0.0.0.0
    volumes: &ml-volumes
      - ../ml/Qwen3-Embedding:/models/Qwen3-Embedding:ro
      - ../ml/Qwen3-Embedding-onnx:/models/Qwen3-Embedding-onnx:ro
      - ./backups:/backups
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on: &ml-depends
      mariadb:
        condition: service_healthy
      milvus:
        condition: service_healthy

  ml-worker:
    profiles: [app]
    image: gresym/ml
    restart: unless-stopped
    command: ["ml", "worker"]
    environment: *ml-env
    volumes: *ml-volumes
    depends_on:
      <<: *ml-depends
      rabbitmq:
        condition: service_healthy
      # ml-api builds the shared gresym/ml image
      ml-api:
        condition: service_started
